<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting...</title>
  <script>
    (function() {
      var allowedTypes = ['notes', 'pyq', 'syllabus'];
      var params = new URLSearchParams(window.location.search);
      var type = params.get('type');
      var sem = params.get('sem');
      var url = '/diploma/';

      if (type && allowedTypes.indexOf(type) !== -1) {
        url = '/diploma/' + type + '/';
        if (type !== 'syllabus' && sem && /^sem[1-6]$/.test(sem)) {
          url += sem + '/';
        }
      }

      window.location.replace(url);
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
